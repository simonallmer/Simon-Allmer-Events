<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EVENTS 2026 — Simon Allmer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@100;200;300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* ── RESET ───────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    a { color: inherit; text-decoration: none; }
    button { background: none; border: none; font-family: inherit; }

    /* ── TOKENS ──────────────────────────────────── */
    :root {
      --bg:          #000000;
      --surf:        rgba(255,255,255,0.04);
      --surf-2:      rgba(255,255,255,0.08);
      --border:      rgba(255,255,255,0.07);
      --border-mid:  rgba(255,255,255,0.12);
      --text:        #ffffff;
      --text-b:      rgba(255,255,255,0.45);
      --text-c:      rgba(255,255,255,0.18);
      --gold:        #c8a96e;
      --gold-dim:    rgba(200,169,110,0.18);
      --gold-glow:   rgba(200,169,110,0.35);
      --games:       #4ade80;
      --snacks:      #f472b6;
      --font: 'Futura','Futura PT','Jost','Century Gothic','Trebuchet MS',sans-serif;
      --ease: cubic-bezier(0.4,0,0.2,1);
      --dur: 0.42s;
      --sw: 320px;
      --pw: 420px;
    }

    /* ── BASE ────────────────────────────────────── */
    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-weight: 300;
      letter-spacing: 0.03em;
      overflow: hidden;
    }

    /* ── APP SHELL ───────────────────────────────── */
    #app {
      display: flex;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* ── SIDEBAR LOGO ────────────────────────────── */
    .sb-logo {
      display: block;
      width: 118px;
      height: auto;
      opacity: 0.9;
      flex-shrink: 0;
    }

    .sb-logo-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .sb-logo-link {
      cursor: pointer;
      flex-shrink: 0;
      line-height: 0;
      transition: opacity 0.2s;
    }

    .sb-logo-link:hover { opacity: 0.7; }

    /* ── SIDEBAR ─────────────────────────────────── */
    #sidebar {
      width: var(--sw);
      height: 100vh;
      flex-shrink: 0;
      position: relative;
      z-index: 1000;
      background: rgba(2,2,2,0.94);
      border-right: 1px solid var(--border);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      transition: width var(--dur) var(--ease);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #sidebar.collapsed { width: 56px; }

    .sidebar-body {
      width: var(--sw);
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      transition: opacity var(--dur) var(--ease);
    }

    #sidebar.collapsed .sidebar-body {
      opacity: 0;
      pointer-events: none;
    }

    /* Sidebar: header */
    .sb-head {
      padding: 34px 28px 26px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sb-brand {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.38em;
      color: var(--text-c);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .sb-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      line-height: 1;
    }

    .sb-year {
      display: inline-block;
      margin-top: 12px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.3em;
      color: var(--gold);
      border: 1px solid rgba(200,169,110,0.35);
      padding: 3px 10px;
    }

    /* Sidebar: list */
    .sb-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .sb-list::-webkit-scrollbar { width: 3px; }
    .sb-list::-webkit-scrollbar-track { background: transparent; }
    .sb-list::-webkit-scrollbar-thumb { background: var(--border-mid); }

    .ev-item {
      padding: 22px 28px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      position: relative;
      transition: background 0.2s;
    }

    .ev-item:hover { background: var(--surf); }
    .ev-item.active { background: var(--surf-2); }

    /* past (completed) events read dimmer */
    .ev-item.is-past { opacity: 0.48; }
    .ev-item.is-past:hover { opacity: 0.72; }

    /* "Past Events" section header in the sidebar list */
    .sb-section-label {
      padding: 20px 28px 10px;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--text-c);
      border-bottom: 1px solid var(--border);
    }

    /* gold left accent for next event */
    .ev-item.is-next::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 2px;
      background: linear-gradient(180deg, transparent, var(--gold), transparent);
    }

    .ev-badge {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.32em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 8px;
      display: block;
    }

    .ev-badge.past { color: var(--text-b); }

    .ev-date {
      font-size: 10px;
      color: var(--text-b);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .ev-name {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .ev-loc {
      font-size: 12px;
      color: var(--text-b);
      letter-spacing: 0.08em;
    }

    .ev-studios {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .studio-pill {
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      padding: 3px 8px;
    }

    .studio-pill.games  { color: var(--games);  background: rgba(74,222,128,0.1);  border: 1px solid rgba(74,222,128,0.25); }
    .studio-pill.snacks { color: var(--snacks); background: rgba(244,114,182,0.1); border: 1px solid rgba(244,114,182,0.25); }
    .studio-pill.comics  { color: #ef4444;  background: rgba(239,68,68,0.1);   border: 1px solid rgba(239,68,68,0.25); }
    .studio-pill.films   { color: #60a5fa;  background: rgba(96,165,250,0.1);  border: 1px solid rgba(96,165,250,0.25); }
    .studio-pill.music   { color: #fbbf24;  background: rgba(251,191,36,0.1);  border: 1px solid rgba(251,191,36,0.25); }
    .studio-pill.journals{ color: #a16207;  background: rgba(161,98,7,0.1);    border: 1px solid rgba(161,98,7,0.25); }

    /* Sidebar: footer */
    .sb-foot {
      padding: 18px 28px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sb-foot-text {
      font-size: 9px;
      letter-spacing: 0.22em;
      color: var(--text-c);
      text-transform: uppercase;
      line-height: 1.8;
    }

    /* Toggle button */
    #sb-toggle {
      position: absolute;
      right: -1px;
      top: 50%;
      transform: translateY(-50%) translateX(100%);
      width: 22px;
      height: 52px;
      background: rgba(8,8,8,0.95);
      border: 1px solid var(--border);
      border-left: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-b);
      transition: color 0.2s, background 0.2s;
      z-index: 1002;
    }

    #sb-toggle:hover { color: var(--text); background: var(--surf-2); }

    #sb-toggle svg {
      transition: transform var(--dur) var(--ease);
    }

    #sidebar.collapsed #sb-toggle svg { transform: rotate(180deg); }

    /* ── MAP CONTAINER ───────────────────────────── */
    #map-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #map {
      width: 100%; height: 100%;
    }

    /* Map: top-left label */
    .map-label {
      pointer-events: none;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.42em;
      color: rgba(255,255,255,0.18);
      text-transform: uppercase;
    }

    /* Map: zoom controls styled */
    .map-zoom {
      position: absolute;
      bottom: 80px;
      right: 24px;
      z-index: 400;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .zoom-btn {
      width: 36px;
      height: 36px;
      background: rgba(0,0,0,0.75);
      border: 1px solid var(--border);
      color: var(--text-b);
      cursor: pointer;
      font-size: 18px;
      font-weight: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      line-height: 1;
    }

    .zoom-btn:hover { background: var(--surf-2); color: var(--text); }

    /* Map: countdown strip */
    #countdown {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 400;
      background: rgba(0,0,0,0.78);
      border: 1px solid var(--border);
      padding: 12px 28px;
      text-align: center;
      pointer-events: none;
      white-space: nowrap;
    }

    .cd-label {
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.38em;
      color: var(--text-c);
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .cd-value {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.18em;
      color: var(--gold);
    }

    /* ── EVENT DETAIL PANEL ───────────────────────── */
    #ev-panel {
      position: absolute;
      top: 0; right: 0; bottom: 0;
      width: var(--pw);
      background: rgba(2,2,2,0.96);
      border-left: 1px solid var(--border);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      z-index: 500;
      transform: translateX(100%);
      transition: transform var(--dur) var(--ease);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #ev-panel.open { transform: translateX(0); }

    .panel-close {
      position: absolute;
      top: 22px; right: 22px;
      width: 34px; height: 34px;
      background: var(--surf);
      border: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-b);
      transition: all 0.2s;
      z-index: 10;
    }

    .panel-close:hover { background: var(--surf-2); color: var(--text); }

    .panel-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 50px 38px 44px;
    }

    .panel-scroll::-webkit-scrollbar { width: 3px; }
    .panel-scroll::-webkit-scrollbar-track { background: transparent; }
    .panel-scroll::-webkit-scrollbar-thumb { background: var(--border-mid); }

    /* Panel: hero */
    .p-eyebrow {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.32em;
      color: var(--text-b);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .p-name {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      line-height: 1.05;
      margin-bottom: 6px;
    }

    .p-sub {
      font-size: 13px;
      color: var(--text-b);
      letter-spacing: 0.1em;
      margin-bottom: 28px;
    }

    /* Panel: divider */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 22px 0;
    }

    /* Panel: info rows */
    .info-row {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .ir-icon {
      width: 16px; height: 16px;
      flex-shrink: 0;
      opacity: 0.35;
      margin-top: 2px;
    }

    .ir-label {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.28em;
      color: var(--text-c);
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .ir-val {
      font-size: 14px;
      font-weight: 400;
      line-height: 1.5;
    }

    .ir-val-b {
      font-size: 12px;
      color: var(--text-b);
      margin-top: 2px;
      line-height: 1.5;
    }

    .ir-val.paid  { color: var(--gold); }
    .ir-val.free  { color: var(--games); }

    /* Panel: unveiling */
    .unveil-wrap {
      background: rgba(200,169,110,0.04);
      border: 1px solid rgba(200,169,110,0.18);
      padding: 20px 22px;
      margin: 22px 0;
    }

    .unveil-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 14px;
    }

    .unveil-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(200,169,110,0.1);
      font-size: 13px;
      letter-spacing: 0.04em;
    }

    .unveil-item:last-child { border-bottom: none; padding-bottom: 0; }

    .unveil-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--gold);
      flex-shrink: 0;
    }

    /* Panel: actions */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 30px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 14px 20px;
      font-family: var(--font);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--text);
      color: var(--bg);
      border: none;
    }

    .btn-primary:hover { background: rgba(255,255,255,0.88); }

    .btn-ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-ghost:hover { background: var(--surf); border-color: var(--border-mid); }

    /* Calendar dropdown */
    .cal-wrap { position: relative; }

    .cal-menu {
      display: none;
      position: absolute;
      bottom: calc(100% + 6px);
      left: 0; right: 0;
      background: #0a0a0a;
      border: 1px solid var(--border-mid);
      z-index: 20;
    }

    .cal-menu.open { display: block; }

    .cal-opt {
      display: block;
      padding: 13px 18px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-b);
      cursor: pointer;
      transition: all 0.15s;
      border-bottom: 1px solid var(--border);
    }

    .cal-opt:last-child { border-bottom: none; }
    .cal-opt:hover { background: var(--surf); color: var(--text); }

    /* ── LEAFLET OVERRIDES ───────────────────────── */
    .leaflet-container { background: #000 !important; }
    .leaflet-control-zoom { display: none !important; }
    .leaflet-control-attribution {
      background: rgba(0,0,0,0.55) !important;
      color: rgba(255,255,255,0.14) !important;
      font-size: 8px !important;
      letter-spacing: 0.05em !important;
    }
    .leaflet-control-attribution a { color: rgba(255,255,255,0.18) !important; }
    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip { background: #0a0a0a; color: #fff; }

    /* ── MARKER ANIMATIONS ───────────────────────── */
    @keyframes pulseRing {
      0%   { transform: scale(0.85); opacity: 0.5; }
      100% { transform: scale(2.0);  opacity: 0; }
    }

    @keyframes journeyDash {
      from { stroke-dashoffset: 28; }
      to   { stroke-dashoffset: 0; }
    }

    /* ── BACK BUTTON ─────────────────────────────── */
    .map-top-left {
      position: absolute;
      top: 24px;
      left: 32px;
      z-index: 400;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }

    .map-label { pointer-events: none; }

    .back-btn {
      pointer-events: all;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.9);
      background: rgba(0,0,0,0.84);
      border: 1px solid rgba(255,255,255,0.3);
      padding: 9px 16px;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      white-space: nowrap;
    }

    .back-btn:hover {
      color: #fff;
      border-color: rgba(255,255,255,0.65);
      background: rgba(20,20,20,0.96);
    }


    /* ── OPEN IN MAPS ────────────────────────────── */
    .maps-wrap { position: relative; }

    .maps-menu {
      display: none;
      position: absolute;
      bottom: calc(100% + 6px);
      left: 0; right: 0;
      background: #0a0a0a;
      border: 1px solid var(--border-mid);
      z-index: 20;
    }

    .maps-menu.open { display: block; }

    .maps-opt {
      display: block;
      padding: 13px 18px;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-b);
      cursor: pointer;
      transition: all 0.15s;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
    }

    .maps-opt:last-child { border-bottom: none; }
    .maps-opt:hover { background: var(--surf); color: var(--text); }

    /* ── MOBILE HAMBURGER ────────────────────────── */
    .mob-menu-btn {
      display: none;
      align-items: center;
      justify-content: center;
      width: 42px; height: 42px;
      background: rgba(0,0,0,0.84);
      border: 1px solid rgba(255,255,255,0.3);
      cursor: pointer;
      color: rgba(255,255,255,0.9);
      pointer-events: all;
      flex-shrink: 0;
    }

    #mob-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 1500;
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px);
    }

    #mob-backdrop.show { display: block; }

    /* ── RESPONSIVE ──────────────────────────────── */
    @media (max-width: 768px) {
      /* Sidebar: hidden off-screen, slides in as overlay */
      #sidebar {
        position: fixed;
        left: 0; top: 0; bottom: 0;
        z-index: 2000;
        width: min(88vw, 320px) !important;
        transform: translateX(-100%);
        transition: transform var(--dur) var(--ease);
      }

      #sidebar.mob-open {
        transform: translateX(0);
      }

      #sidebar.mob-open .sidebar-body {
        opacity: 1 !important;
        pointer-events: all !important;
      }

      /* Desktop collapse toggle not needed on mobile */
      #sb-toggle { display: none; }

      /* Map fills full viewport */
      #map-wrap {
        width: 100vw !important;
        height: 100vh;
        flex: none;
      }

      /* Event panel: full width */
      #ev-panel {
        width: 100vw !important;
      }

      .panel-scroll {
        padding: 52px 22px 44px;
      }

      .p-name { font-size: 22px; }

      /* Show hamburger button */
      .mob-menu-btn { display: flex; }

      /* Back button area */
      .map-top-left {
        top: 16px;
        left: 16px;
        gap: 8px;
      }

      /* Countdown full width */
      #countdown {
        left: 16px;
        right: 16px;
        bottom: 16px;
        transform: none;
        text-align: left;
        padding: 10px 16px;
      }

      .cd-value { font-size: 11px; letter-spacing: 0.1em; }

      /* Zoom */
      .map-zoom { bottom: 70px; right: 14px; }

      /* Cal / maps dropdowns open upward with enough room */
      .actions { gap: 8px; }
    }

    @media (max-width: 480px) {
      .p-name { font-size: 20px; }
      .panel-scroll { padding: 48px 18px 36px; }
    }

    /* ── UTILITY ─────────────────────────────────── */
    .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }
  </style>
</head>
<body>
<div id="app">

  <!-- ═══ LEFT SIDEBAR ══════════════════════════════════ -->
  <aside id="sidebar">
    <div class="sidebar-body">

      <!-- Header -->
      <div class="sb-head">

// ─────────────────────────────────────────────────────────
// STATUS  (derived from the calendar, not hard-coded)
// ─────────────────────────────────────────────────────────
// An event's `status` field above is only a seed — the real status is
// computed from today's date every load:
//   · endDate in the past            → 'past'
//   · soonest event still to come    → 'next'
//   · any later events               → 'upcoming'
// Past events are retained as a history, capped at MAX_PAST — once there
// are more than that, the oldest ones are dropped from the list.
const MAX_PAST = 5;

function refreshStatuses() {
  const now = new Date();

  // Chronological order, so the first future event becomes "next".
  EVENTS.sort((a, b) => a.startDate - b.startDate);

  let nextAssigned = false;
  EVENTS.forEach(ev => {
    if (ev.endDate < now) {
      ev.status = 'past';
    } else if (!nextAssigned) {
      ev.status = 'next';
      nextAssigned = true;
    } else {
      ev.status = 'upcoming';
    }
  });

  // Keep only the MAX_PAST most recent past events — delete the oldest.
  // EVENTS is sorted oldest→newest, so the earliest past entries lead.
  const past = EVENTS.filter(e => e.status === 'past');
  if (past.length > MAX_PAST) {
    past.slice(0, past.length - MAX_PAST).forEach(ev => {
      const i = EVENTS.indexOf(ev);
      if (i !== -1) EVENTS.splice(i, 1);
    });
  }
}
refreshStatuses();

// ─────────────────────────────────────────────────────────
// COUNTDOWN
// ─────────────────────────────────────────────────────────
function updateCountdown() {
  const now  = new Date();
  const next = EVENTS.find(e => e.startDate > now);
  const el   = document.getElementById('cd-val');

  if (!next) { el.textContent = 'Tour complete'; return; }

  const diff = next.startDate - now;
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff % 86400000) / 3600000);
  const m = Math.floor((diff % 3600000)  /   60000);

  el.textContent = `${d}D  ${h}H  ${m}M  ·  ${next.name}`;
}
updateCountdown();
setInterval(updateCountdown, 30000);

// ─────────────────────────────────────────────────────────
// SIDEBAR LIST
// ─────────────────────────────────────────────────────────
function makeItem(ev) {
  const item = document.createElement('div');
  item.className = 'ev-item'
    + (ev.status === 'next' ? ' is-next' : '')
    + (ev.status === 'past' ? ' is-past' : '');
  item.dataset.id = ev.id;

  const pills = ev.studios
    .map(s => `<span class="studio-pill ${s}">${STUDIO_LABELS[s]}</span>`)
    .join('');

  const badge = ev.status === 'next'
    ? '<span class="ev-badge">◆ Next Event</span>'
    : ev.status === 'past'
      ? '<span class="ev-badge past">✓ Completed</span>'
      : '';

  item.innerHTML = `
    ${badge}
    <div class="ev-date">${ev.dateLabel}</div>
    <div class="ev-name">${ev.name}</div>
    <div class="ev-loc">${ev.city}, ${ev.country}</div>
    <div class="ev-studios">${pills}</div>
  `;

  item.addEventListener('click', () => openEvent(ev));
  return item;
}

function buildList() {
  const container = document.getElementById('sb-list');
  container.innerHTML = '';

  const upcoming = EVENTS.filter(e => e.status !== 'past');
  const past = EVENTS.filter(e => e.status === 'past')
                     .sort((a, b) => b.startDate - a.startDate); // newest first

  upcoming.forEach(ev => container.appendChild(makeItem(ev)));

  if (past.length) {
    const hdr = document.createElement('div');
    hdr.className = 'sb-section-label';
    hdr.textContent = 'Past Events';
    container.appendChild(hdr);
    past.forEach(ev => container.appendChild(makeItem(ev)));
  }
}
buildList();

// Animated dashes

// Apply CSS animation once the SVG path element exists

// ─────────────────────────────────────────────────────────

// ─────────────────────────────────────────────────────────
// EVENT PANEL
// ─────────────────────────────────────────────────────────
const panel   = document.getElementById('ev-panel');
const content = document.getElementById('panel-content');

    <!-- Location -->

      <svg class="ir-icon" viewBox="0 0 16 16" fill="none"
           stroke="currentColor" stroke-width="1.4">
        <path d="M8 9a3 3 0 100-6 3 3 0 000 6z"/>

             stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M6.5 1h3.5v3.5M10 1L4.5 6.5M1.5 3.5H1v6.5h6.5V9"/>

      <div class="cal-wrap">
        <button class="btn btn-ghost" onclick="toggleCal(this)">
          <svg width="11" height="11" viewBox="0 0 11 11" fill="none"
               stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <rect x="0.5" y="1.5" width="10" height="9" rx="0.75"/>

function closePanel() {
  panel.classList.remove('open');
  document.querySelectorAll('.ev-item').forEach(el => el.classList.remove('active'));
  map.flyTo([48.4, 13.65], 7, { duration: 1.1, easeLinearity: 0.3 });
}

// ─────────────────────────────────────────────────────────
// CALENDAR HELPERS
// ─────────────────────────────────────────────────────────
function toggleCal(btn) {
  const menu = btn.nextElementSibling;
  menu.classList.toggle('open');
  // Close on outside click
  const close = e => {
    if (!menu.contains(e.target) && e.target !== btn) {
      menu.classList.remove('open');
      document.removeEventListener('click', close, true);
    }
  };
  document.addEventListener('click', close, true);
}

function dlICS(id) {
  const ev = EVENTS.find(e => e.id === id);
  if (!ev) return;

  const fmtICS = d =>
    d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');

  const ics = [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Simon Allmer Entertainment//Events 2026//EN',
    'BEGIN:VEVENT',
    `UID:${ev.id}-2026@simonallmer.com`,
    `DTSTART:${fmtICS(ev.startDate)}`,
    `DTEND:${fmtICS(ev.endDate)}`,
    `SUMMARY:Simon Allmer @ ${ev.name}`,
    `LOCATION:${ev.address}`,
    `URL:${ev.officialUrl}`,
    `DESCRIPTION:Simon Allmer attending ${ev.name} in ${ev.city}\\, ${ev.country}.\\n\\nOfficial: ${ev.officialUrl}`,
    'END:VEVENT',
    'END:VCALENDAR',
  ].join('\r\n');

  const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = Object.assign(document.createElement('a'), {
    href: url,
    download: `simon-allmer-${ev.id}.ics`,
  });
  a.click();
  URL.revokeObjectURL(url);
}

function toggleMaps(btn) {
  const menu = btn.nextElementSibling;
  menu.classList.toggle('open');
  const close = e => {
    if (!menu.contains(e.target) && e.target !== btn) {
      menu.classList.remove('open');
      document.removeEventListener('click', close, true);
    }
  };
  document.addEventListener('click', close, true);
}

// ── MOBILE SIDEBAR ──────────────────────────────────────────
const mobMenuBtn  = document.getElementById('mob-menu-btn');
const mobBackdrop = document.getElementById('mob-backdrop');

mobMenuBtn.addEventListener('click', () => {
  sidebar.classList.add('mob-open');
  mobBackdrop.classList.add('show');
});

mobBackdrop.addEventListener('click', () => {
  sidebar.classList.remove('mob-open');
  mobBackdrop.classList.remove('show');
});

function closeMobSidebar() {
  sidebar.classList.remove('mob-open');
  mobBackdrop.classList.remove('show');
}

// Expose for inline onclick
window.toggleCal  = toggleCal;
window.toggleMaps = toggleMaps;
window.dlICS      = dlICS;

</script>
